<body>

  <div class="full-head" style="width:100%; position: relative; z-index: 100; ">
    <div class="row">
      <div class="large-12 columns" style="padding-top:20px;z-index:20;">
        <ul class="button-group even-6">

                alt="Reset"></a></li>

                <li><a id="static-result" onclick="showStaticResult();"><img style="width: 30px; padding-top: 10px;" src="img/settings.png"
                  ></li></a>

<div class="body">
  <div class="main-container">
  <div class="row" style="z-index: 0; position: relative;">
    <div class="large-12 columns">
      <h3 style="text-align:center;margin-top:80px; margin-bottom: 80px;" id="headline">Let's see who are the lucky
        ones?</h3>

      <div id="popdown">
        <div id="names" class="inbox"><textarea name="namesbox" id="namesbox"></textarea></div>
      </div>

      <!-- Rolling + final result (single box) -->
      <div id="values" style="z-index: 0;"></div>

    </div>
  </div>
  <div>
    <div id="varnote"></div>
    <div id="srtbtn" style="text-align: center; margin-top: 60px;"><a id="go-down" onclick="go();"><img
          style="width: 100px;" src="img/go-white.png" alt="Go"></a></div>
  </div>

  <div style="text-align: center; margin-top: 60px;"><img style="width: 200px;" src="img/sar-logo.png"></div>
  </div>
</div>
</div>
  <script>
    document.write('<script src=' +
      ('__proto__' in {} ? 'js/vendor/zepto' : 'js/vendor/jquery') +
      '.js><\/script>')
  </script>

  <script src="js/foundation.min.js"></script>
  <script>
    $(document).foundation();
  </script>

<script>
    var names = [];
  var useStaticResult = false;

    document.addEventListener('DOMContentLoaded', function () {
        fetchNames(); // Load stored names on page load
    });

    function reset(namesList) {
        if (!namesList || namesList.length === 0) return;

        setTimeout("$('#go').removeAttr('disabled')", 11005);

        var namesbreak = namesList.join('\n');
        $("#namesbox").val(namesbreak);

        const varnoteDiv = $('#varnote');
        varnoteDiv.html(''); // Clear existing content

        namesList.forEach(name => {
            const nameDiv = $('<div class="name-slider-item"></div>');
            nameDiv.text(name);
            varnoteDiv.append(nameDiv);
        });

        // Destroy existing slick instance before reinitializing
        if (varnoteDiv.hasClass('slick-initialized')) {
            varnoteDiv.slick('unslick');
        }

        $('#varnote').slick({
            speed: 9000,
            infinite: true,
            slidesToShow: 1,
            slidesToScroll: 1,
            autoplay: true,
            autoplaySpeed: 0,
            arrows: false,
            pauseOnHover: false,
            variableWidth: true,
            cssEase: 'linear'
        });
    }

    function fetchNames() {
        let storedNames = localStorage.getItem("namesList");

        if (storedNames) {
            names = storedNames.split('|'); // Using '|' as a separator
            reset(names);
        }
    }

    function save() {
        $("#varnote").hide();
        $("#srtbtn").hide();
        $("#popdown").show();
        $("#values").hide();
        $("div").remove("#result1");

        names = $("#namesbox").val().split(/\r?\n/).filter(name => name.trim() !== ""); // Remove empty lines
        localStorage.setItem("namesList", names.join('|')); // Store using '|' separator

        $('#headline').fadeOut().text('The number list is saved and updated.').fadeIn();
        $("#names").show();
        $('#namesbox').attr('disabled', 'disabled');
    }

  function namelist() {
      $("#varnote").hide();
      $("#srtbtn").hide();
      $('#namesbox').removeAttr('disabled', 'disabled');
      $('#headline').text('Configure number list');
      $("#popdown").show();
      $("#values").hide();
      $("#names").show();
      $('body').css({ "overflow-y": "visible" });
    }


    function go() {
        $("#varnote").hide();
        $("#srtbtn").hide();
        $('body').css({ "overflow-y": "hidden" });
        $('#go, #list, #save').attr('disabled', 'disabled');
        $('#headline').slideUp();
        $('#namesbox').slideDown();

        names = $("#namesbox").val().split(/\r?\n/).filter(name => name.trim() !== "");
      if (names.length === 0) {
        $('#go, #list, #save').removeAttr('disabled');
        $('#headline').text('Add at least one name to start.').slideDown();
        return;
      }

      var winner = pickWinner(names);

      $("#values").show().empty();
      $("#popdown").hide();
      $("div").remove(".extra");
      $("#playback").html("");

        $('.full-head').addClass('background');
        $("#static-result").addClass('disabled');
        $("#go").addClass('disabled');

      if (useStaticResult) {
        // No shuffle animation; immediately show result.
        setTimeout(() => standout([winner]), 100);
        return;
      }

      // Slot-machine style roll that lands on the actual chosen winner.
      var $rolling = $(
        '<div class="winner-box">' +
          '<img src="https://i.postimg.cc/wBdKpGsF/pngwing-com-1.png" alt="Crown" style="display: none">' +
          '<span></span>' +
        '</div>'
      );
      $('#values').append($rolling);

      var spinPool = shuffleCopy(names);
      var poolIndex = 0;
      var ticks = 0;
      var tickMs = 70;
      var spinDurationMs = 5000;
      var totalTicks = Math.ceil(spinDurationMs / tickMs);

      var intervalId = setInterval(() => {
        ticks += 1;

        if (poolIndex >= spinPool.length) {
          spinPool = shuffleCopy(names);
          poolIndex = 0;
        }

        var nextName = spinPool[poolIndex++];
        if (ticks >= totalTicks) {
          nextName = winner;
        }

            $rolling.find('span').text(nextName);

        if (ticks >= totalTicks) {
          clearInterval(intervalId);
          setTimeout(() => standout([winner]), 150);
        }
      }, tickMs);
    }

    function showStaticResult() {
      useStaticResult = !useStaticResult;
      var msg = useStaticResult ? 'Static result mode enabled.' : 'Rolling animation mode enabled.';
      $('#headline').stop(true, true).fadeOut(120, function () {
        $(this).text(msg).fadeIn(120);
      });
    }

    function pickWinner(list) {
      return list[randomInt(list.length)];
    }

    function removeOneOccurrence(list, value) {
      var idx = list.indexOf(value);
      if (idx === -1) return list;
      list.splice(idx, 1);
      return list;
    }

    function shuffleCopy(list) {
      var copy = list.slice();
      shuffleInPlace(copy);
      return copy;
    }

    function shuffleInPlace(list) {
      for (var i = list.length - 1; i > 0; i--) {
        var j = randomInt(i + 1);
        var tmp = list[i];
        list[i] = list[j];
        list[j] = tmp;
      }
      return list;
    }

    function randomInt(maxExclusive) {
      if (!Number.isFinite(maxExclusive) || maxExclusive <= 0) return 0;

      // Prefer cryptographically-strong randomness when available.
      if (window.crypto && window.crypto.getRandomValues) {
        var uint32 = new Uint32Array(1);
        var limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
        do {
          window.crypto.getRandomValues(uint32);
        } while (uint32[0] >= limit);
        return uint32[0] % maxExclusive;
      }

      return Math.floor(Math.random() * maxExclusive);
    }

    function standout(winners) {
        $('.full-head').removeClass('background');
        $("#static-result").removeClass('disabled');
        $("#go").removeClass('disabled');
      $('#values').html('');

      winners.forEach((winner) => {
        const winnerDiv = $(
          '<div class="winner-box">' +
            '<img src="https://i.postimg.cc/wBdKpGsF/pngwing-com-1.png" alt="Crown" style="display: none">' +
            '<span></span>' +
          '</div>'
        );
        winnerDiv.find('span').text(winner);
        $('#values').append(winnerDiv);
      });

        $('#headline').text('MEET US ON STAGE').slideDown();
        $('#go, #list, #save').removeAttr('disabled');

        // Remove winner(s) from the pool so they can't win again.
        winners.forEach((winner) => {
          removeOneOccurrence(names, winner);
        });
        $("#namesbox").val(names.join('\n'));
        localStorage.setItem("namesList", names.join('|'));
    }
</script>
